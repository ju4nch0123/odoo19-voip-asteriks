[general]
static=yes
writeprotect=no

[from-internal]
; Echo Test
exten => *43,1,NoOp(Starting Echo Test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Playback(beep)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

exten => 43,1,Goto(*43,1)
exten => 777,1,Goto(*43,1)
exten => 600,1,Goto(*43,1)

; Direct dialing
exten => 1060,1,NoOp(Calling User 1060 from ${CALLERID(num)})
 same => n,Dial(PJSIP/1060,30)
 same => n,NoOp(Dial 1060 finished: DIALSTATUS=${DIALSTATUS}, HANGUPCAUSE=${HANGUPCAUSE})
 same => n,Hangup()

exten => 1061,1,NoOp(Calling User 1061 from ${CALLERID(num)})
 same => n,Dial(PJSIP/1061,30)
 same => n,NoOp(Dial 1061 finished: DIALSTATUS=${DIALSTATUS}, HANGUPCAUSE=${HANGUPCAUSE})
 same => n,Hangup()
