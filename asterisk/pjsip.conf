[general]

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088
local_net=127.0.0.1/32
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
local_net=127.0.0.1/32
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8

[webrtc_client](!)
type=endpoint
context=from-internal
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_cert_file=/etc/asterisk/keys/asterisk.pem
dtls_private_key=/etc/asterisk/keys/asterisk.pem
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
direct_media=no

; Endpoint 1060
[1060](webrtc_client)
auth=auth1060
aors=1060

[auth1060]
type=auth
auth_type=userpass
username=1060
password=odoo1060

[1060]
type=aor
max_contacts=5
remove_existing=yes

; Endpoint 1061
[1061](webrtc_client)
auth=auth1061
aors=1061

[auth1061]
type=auth
auth_type=userpass
username=1061
password=odoo1061

[1061]
type=aor
max_contacts=5
remove_existing=yes
